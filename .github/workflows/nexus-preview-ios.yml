name: NEXUS | Publicar previa iOS isolada
on:
  push:
    branches: [preview/nexus-intake-ios]
    paths: ['.github/workflows/nexus-preview-ios.yml']
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Instalar dependencias
        working-directory: mobile
        run: npm ci --ignore-scripts
      - name: Validar TypeScript e testes
        working-directory: mobile
        run: |
          npm run check
          npm test
      - name: Exportar JavaScript iOS para Expo Go
        working-directory: mobile
        env:
          CI: 'true'
        run: npx expo export --platform ios --no-bytecode --output-dir ../nexus-preview-ios
      - name: Conferir exportacao e gravar hashes
        run: |
          python3 - <<'PY'
          import json, hashlib, base64, pathlib
          root=pathlib.Path('nexus-preview-ios')
          m=json.loads((root/'metadata.json').read_text())['fileMetadata']['ios']
          assert m['bundle'].endswith('.js'),m
          def asset(path,kind,ext=None):
              f=root/path
              assert f.is_file()
              d={'path':path,'key':f.stem,'hash':base64.urlsafe_b64encode(hashlib.sha256(f.read_bytes()).digest()).decode().rstrip('='),'contentType':kind}
              if ext: d['fileExtension']='.'+ext
              return d
          data={'source':'b1e76c6160c63220058fa9a5ed9b2f2016f89b6f','launchAsset':asset(m['bundle'],'application/javascript'),'assets':[asset(a['path'],'image/png',a['ext']) for a in m['assets']]}
          assert b'NEXUS' in (root/m['bundle']).read_bytes()
          (root/'manifest-data.json').write_text(json.dumps(data,ensure_ascii=False))
          PY
      - name: Publicar apenas artefatos na branch isolada
        run: |
          test "$GITHUB_REF" = "refs/heads/preview/nexus-intake-ios"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f nexus-preview-ios/
          git commit -m "Publicar exportacao iOS NEXUS [skip ci]"
          git push origin HEAD:refs/heads/preview/nexus-intake-ios
